<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра через Google Таблицы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #fafafa; }
        button { background: #3390ec; color: #fff; border: none; padding: 12px; border-radius: 8px; width: 100%; margin-top: 10px; font-size: 16px; }
        input { padding: 10px; width: 80%; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; text-align: center; }
        .screen { display: none; }
        .active { display: block; }
    </style>
</head>
<body>

    <h2 id="status">Поиск соперника через Google Таблицы</h2>
    
    <div id="screen-start" class="screen active">
        <button id="search-btn">Начать поиск</button>
    </div>

    <div id="screen-wait" class="screen">
        <p id="wait-text">Ожидаем игроков...</p>
    </div>

    <div id="screen-thinker" class="screen">
        <p>Загадай число (1-100):</p>
        <input type="number" id="secret-number">
        <button id="set-btn">Загадать число</button>
    </div>

    <div id="screen-guesser" class="screen">
        <p>Твой ход! Угадай число соперника:</p>
        <input type="number" id="guess-number">
        <button id="guess-btn">Проверить</button>
        <p id="hint-text" style="color: red; font-weight: bold;"></p>
    </div>

    <script>
        // ВСТАВЬ СЮДА СВОЮ ССЫЛКУ ИЗ GOOGLE APPS SCRIPT
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzBKasN-W_r4-Sy-htflxuloaGybOrk3gG7WLoAdoilFQGOs8XauEmopbtJD1gefRw3/exec"; 

        const tg = window.Telegram.WebApp;
        const myId = tg.initDataUnsafe?.user?.id || "user_" + Math.floor(Math.random() * 10000);
        
        let roomId = "";
        let myRole = "";
        let loopInterval = null;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        async function sendRequest(data) {
            const response = await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(data)
            });
            return await response.json();
        }

        document.getElementById('search-btn').addEventListener('click', async () => {
            showScreen('screen-wait');
            document.getElementById('status').innerText = "В очереди...";
            
            let res = await sendRequest({ action: "search", userId: myId });
            
            if (res.status === "found") {
                roomId = res.roomId;
                myRole = res.role;
                startGame();
            } else {
                // Если мы первые в очереди, начинаем "пинговать" таблицу каждые 3 секунды в ожидании второго игрока
                loopInterval = setInterval(async () => {
                    let check = await sendRequest({ action: "check_queue", userId: myId });
                    if (check.status === "found") {
                        clearInterval(loopInterval);
                        roomId = check.roomId;
                        myRole = check.role;
                        startGame();
                    }
                }, 3000);
            }
        });

        function startGame() {
            document.getElementById('status').innerText = "Игра началась!";
            if (myRole === "thinker") {
                showScreen('screen-thinker');
            } else {
                document.getElementById('wait-text').innerText = "Соперник придумывает число...";
                showScreen('screen-wait');
                startGameStateLoop(); // Угадывающий ждет, пока появится число
            }
        }

        document.getElementById('set-btn').addEventListener('click', async () => {
            let num = document.getElementById('secret-number').value;
            if (num) {
                await sendRequest({ action: "set_number", roomId: roomId, number: parseInt(num) });
                document.getElementById('wait-text').innerText = "Соперник пытается угадать...";
                showScreen('screen-wait');
                startGameStateLoop(); // Загадывающий начинает следить за догадками соперника
            }
        });

        document.getElementById('guess-btn').addEventListener('click', async () => {
            let num = document.getElementById('guess-number').value;
            if (num) {
                let res = await sendRequest({ action: "guess", roomId: roomId, number: parseInt(num) });
                if (res.result === "win") {
                    document.getElementById('status').innerText = "🎉 Ты победил!";
                    showScreen('screen-start');
                } else {
                    document.getElementById('hint-text').innerText = "Подсказка: " + res.result;
                }
            }
        });

        // Каждые 3 секунды проверяем состояние игры в таблице
        function startGameStateLoop() {
            loopInterval = setInterval(async () => {
                let state = await sendRequest({ action: "game_state", roomId: roomId });
                
                if (myRole === "guesser" && state.secret !== "") {
                    clearInterval(loopInterval);
                    showScreen('screen-guesser'); // Если число появилось, включаем экран ввода
                }
                
                if (state.result === "win") {
                    clearInterval(loopInterval);
                    document.getElementById('status').innerText = myRole === "thinker" ? "😢 Тебя обыграли!" : "🎉 Победа!";
                    showScreen('screen-start');
                } else if (myRole === "thinker" && state.lastGuess !== "") {
                    document.getElementById('wait-text').innerText = `Соперник ввел ${state.lastGuess}. Результат: ${state.result}`;
                }
            }, 3000);
        }
    </script>
</body>
</html>
