<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Угадай число онлайн</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            text-align: center;
            padding: 30px 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 24px;
        }
        p {
            font-size: 16px;
            color: var(--tg-theme-hint-color, #888888);
            margin-bottom: 20px;
        }
        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 280px;
            transition: opacity 0.2s ease;
        }
        button:active {
            opacity: 0.8;
        }
        input {
            padding: 12px;
            font-size: 18px;
            width: 100%;
            max-width: 200px;
            margin: 15px 0;
            border: 2px solid var(--tg-theme-hint-color, #ccc);
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            border-radius: 10px;
            text-align: center;
            outline: none;
        }
        input:focus {
            border-color: var(--tg-theme-button-color, #3390ec);
        }
        .screen { display: none; width: 100%; }
        .active { display: block; }
        #hint-text {
            font-size: 18px;
            font-weight: bold;
            color: #e53935;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h2 id="status">Загрузка игры...</h2>
    
    <div id="screen-start" class="screen active">
        <p>Сыграй в «Угадай число» против реального соперника</p>
        <button id="search-btn">Найти соперника</button>
    </div>

    <div id="screen-wait" class="screen">
        <p id="wait-text">Ищем свободного игрока в таблице...</p>
    </div>

    <div id="screen-thinker" class="screen">
        <p>Ты загадываешь! Введи тайное число от 1 до 100:</p>
        <input type="number" id="secret-number" min="1" max="100" placeholder="50">
        <button id="set-btn">Загадать число</button>
    </div>

    <div id="screen-guesser" class="screen">
        <p>Соперник загадал число! Твоя догадка:</p>
        <input type="number" id="guess-number" min="1" max="100" placeholder="?>">
        <button id="guess-btn">Проверить ход</button>
        <p id="hint-text"></p>
    </div>

    <script>
        // ВАЖНО: Вставь сюда URL Веб-приложения, скопированный из Google Apps Script
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyV5kQerAMIWoIZ4WRekFbofx_65K0dOn8AG2Ln2MiQKtgRRiL36-kC_38Bz2URKY8J/exec"; 

        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Генерируем 100% уникальный ID для каждого устройства
        const myId = tg.initDataUnsafe?.user?.id || "user_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
        
        let roomId = "";
        let myRole = "";
        let loopInterval = null;

        document.getElementById('status').innerText = "Готов к игре";

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        async function sendRequest(data) {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(data)
                });
                return await response.json();
            } catch (err) {
                console.error("Ошибка запроса к Google Таблице:", err);
                return { status: "error" };
            }
        }

        // Клик по кнопке "Найти соперника"
        document.getElementById('search-btn').addEventListener('click', async () => {
            showScreen('screen-wait');
            document.getElementById('status').innerText = "В очереди...";
            
            let res = await sendRequest({ action: "search", userId: myId });
            
            if (res.status === "found") {
                roomId = res.roomId;
                myRole = res.role;
                startGame();
            } else {
                // Пингуем таблицу каждые 3 секунды, проверяя, не зашел ли второй игрок
                loopInterval = setInterval(async () => {
                    let check = await sendRequest({ action: "check_queue", userId: myId });
                    if (check.status === "found") {
                        clearInterval(loopInterval);
                        roomId = check.roomId;
                        myRole = check.role;
                        startGame();
                    }
                }, 3000);
            }
        });

        // Инициализация матча
        function startGame() {
            document.getElementById('status').innerText = "Игра началась!";
            if (myRole === "thinker") {
                showScreen('screen-thinker');
            } else {
                document.getElementById('wait-text').innerText = "Соперник придумывает число...";
                showScreen('screen-wait');
                startGameStateLoop();
            }
        }

        // Отправка загаданного числа
        document.getElementById('set-btn').addEventListener('click', async () => {
            let num = document.getElementById('secret-number').value;
            if (num) {
                await sendRequest({ action: "set_number", roomId: roomId, number: parseInt(num) });
                document.getElementById('wait-text').innerText = "Соперник пытается угадать...";
                showScreen('screen-wait');
                startGameStateLoop(); // Начинаем слушать ходы соперника
            }
        });

        // Отправка попытки угадать
        document.getElementById('guess-btn').addEventListener('click', async () => {
            let num = document.getElementById('guess-number').value;
            if (num) {
                let res = await sendRequest({ action: "guess", roomId: roomId, number: parseInt(num) });
                if (res.result === "win") {
                    document.getElementById('status').innerText = "🎉 Ты победил!";
                    document.getElementById('hint-text').innerText = "";
                    showScreen('screen-start');
                } else {
                    document.getElementById('hint-text').innerText = "Надо: " + res.result;
                }
            }
        });

        // Цикл проверки обновлений игрового поля
        function startGameStateLoop() {
            loopInterval = setInterval(async () => {
                let state = await sendRequest({ action: "game_state", roomId: roomId });
                
                // Если мы угадывающий и соперник наконец загадал число
                if (myRole === "guesser" && state.secret !== "") {
                    clearInterval(loopInterval);
                    showScreen('screen-guesser');
                }
                
                // Проверка на победу
                if (state.result === "win") {
                    clearInterval(loopInterval);
                    document.getElementById('status').innerText = myRole === "thinker" ? "😢 Тебя обыграли!" : "🎉 Победа!";
                    document.getElementById('hint-text').innerText = "";
                    showScreen('screen-start');
                } 
                // Обновление статуса для загадывающего
                else if (myRole === "thinker" && state.lastGuess !== "") {
                    document.getElementById('wait-text').innerText = `Соперник ввел число ${state.lastGuess}. Результат: ${state.result}`;
                }
            }, 3000);
        }
    </script>
</body>
</html>
